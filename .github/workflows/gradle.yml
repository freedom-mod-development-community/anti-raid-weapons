# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle
name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Minecraft Version
        id: detect
        run: |
          # build.gradle または gradle.properties からバージョン文字列を検索し、環境変数を設定します
          if grep -qE "1\.20\.1" build.gradle gradle.properties 2>/dev/null; then
            echo "MC 1.20.1 detected."
            echo "java_version=17" >> $GITHUB_OUTPUT
            echo "gradle_task=build" >> $GITHUB_OUTPUT
          elif grep -qE "1\.12\.2" build.gradle gradle.properties 2>/dev/null; then
            echo "MC 1.12.2 detected."
            echo "java_version=8" >> $GITHUB_OUTPUT
            echo "gradle_task=setupCiWorkspace build" >> $GITHUB_OUTPUT
          elif grep -qE "1\.7\.10" build.gradle gradle.properties 2>/dev/null; then
            echo "MC 1.7.10 detected."
            echo "java_version=8" >> $GITHUB_OUTPUT
            echo "gradle_task=setupCIWorkspace build" >> $GITHUB_OUTPUT
          else
            echo "Version not explicitly matched, defaulting to Java 17"
            echo "java_version=17" >> $GITHUB_OUTPUT
            echo "gradle_task=build" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK ${{ steps.detect.outputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.detect.outputs.java_version }}
          distribution: 'temurin' # Minecraft Mod開発で標準的かつ安定しているJDK
          cache: 'gradle'         # 追加: 依存関係のダウンロードをキャッシュし、次回以降のビルドを大幅に高速化します

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew ${{ steps.detect.outputs.gradle_task }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Package-${{ github.sha }} # コミットハッシュをつけてファイルを一意にします
          path: build/libs/
